name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_USER: misty
          POSTGRES_PASSWORD: misty-test-password
          POSTGRES_DB: misty_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U misty -d misty_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: misty
      DB_PASSWORD: misty-test-password
      DB_NAME: misty_test
      DB_SSLMODE: disable
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: "5432"
      TEST_DB_USER: misty
      TEST_DB_PASSWORD: misty-test-password
      TEST_DB_NAME: misty_test
      TEST_DB_SSLMODE: disable
      STRIPE_WEBHOOK_SECRET: whsec_ci_test_secret_123
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Scan source for secrets
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
          detect --source=/repo --no-git --redact --config=/repo/.gitleaks.toml
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.12
          cache: true
      - name: Check Go formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - run: go vet ./...
      - run: ./scripts/check-go-file-sizes.sh
      - name: Install pinned migration tool
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.27.3
      - run: ./scripts/goose.sh up
      - name: Test backend and database integration serially
        run: go test -p 1 ./... -count=1
      - run: ./scripts/check-container-contract.sh
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/journal-collab/.nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/agent-runtime/package-lock.json
            apps/journal-collab/package-lock.json
      - name: Install Hono backend dependencies
        run: npm ci
      - name: Verify Hono backend foundation
        run: npm run check
      - name: Verify Go and native filesystem avatar compatibility
        run: node scripts/migration/check-avatar-storage.mjs
      - name: Create isolated Hono integration database
        env:
          PGPASSWORD: misty-test-password
        run: psql -h 127.0.0.1 -U misty -d misty_test -v ON_ERROR_STOP=1 -c 'CREATE DATABASE misty_hono_test'
      - name: Test Hono database and payments integration
        env:
          MISTY_TEST_DATABASE_URL: postgres://misty:misty-test-password@127.0.0.1:5432/misty_hono_test
        run: npm run test:integration
      - run: npm ci
        working-directory: apps/journal-collab
      - run: npm run typecheck
        working-directory: apps/journal-collab
      - run: npm test
        working-directory: apps/journal-collab
      - run: npm run test:runtime
        working-directory: apps/journal-collab
      - name: Verify native API tickets against the collaboration Worker
        run: node scripts/migration/check-journal-runtime.mjs
      - run: npm run audit:production
        working-directory: apps/journal-collab
      - name: Install agent runtime dependencies
        run: npm ci
        working-directory: apps/agent-runtime
      - name: Type-check agent runtime
        run: npm run typecheck
        working-directory: apps/agent-runtime
      - name: Test agent runtime
        run: npm test
        working-directory: apps/agent-runtime
      - name: Build agent runtime
        run: npm run build
        working-directory: apps/agent-runtime
