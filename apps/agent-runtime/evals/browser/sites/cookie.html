<!doctype html><html><head><meta charset="utf-8"><title>Quarterly report</title>
<style>body{font:15px system-ui;margin:24px}#banner{position:fixed;inset:auto 0 0 0;height:60%;background:#fff;border-top:2px solid #333;padding:24px;box-shadow:0 -4px 20px #0003}main{padding-top:40vh}</style></head>
<body><main><h1>Q3 report</h1><p>Revenue grew 12% quarter over quarter.</p><button id="dl">Download report</button><p id="status" role="status"></p></main>
<div id="banner" role="dialog" aria-label="Cookie preferences"><h2>We value your privacy</h2><p>Choose which cookies we may use.</p><button id="reject">Reject non-essential</button> <button id="accept">Accept all</button></div>
<script>
window.__evalState={downloaded:false,cookies:null};
const close=v=>{window.__evalState.cookies=v;document.getElementById('banner').remove()};
document.getElementById('reject').onclick=()=>close('essential');document.getElementById('accept').onclick=()=>close('all');
document.getElementById('dl').onclick=()=>{window.__evalState.downloaded=true;document.getElementById('status').textContent='Report downloaded'};
</script></body></html>
