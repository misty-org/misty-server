name: misty-server

x-api-image: &api-image
  image: ${MISTY_API_IMAGE:-misty-server:local}
  build:
    context: .
    dockerfile: Dockerfile

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    logging: {driver: local, options: {max-size: "10m", max-file: "3"}}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_MIGRATION_USER:-misty}
      POSTGRES_PASSWORD: ${DB_MIGRATION_PASSWORD:-misty}
      POSTGRES_DB: ${DB_NAME:-misty_server}
      MISTY_APP_DB_USER: ${DB_USER:-misty_app}
      MISTY_APP_DB_PASSWORD: ${DB_PASSWORD:-misty}
    ports:
      - "127.0.0.1:${DB_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks: [database, edge]

  setup:
    image: misty-server-setup-dev:local
    build:
      context: .
      dockerfile: scripts/docker/setup.Dockerfile
      additional_contexts:
        api: service:misty-api
    logging: {driver: local, options: {max-size: "10m", max-file: "3"}}
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${DB_NAME:-misty_server}
      PGUSER: ${DB_MIGRATION_USER:-misty}
      PGPASSWORD: ${DB_MIGRATION_PASSWORD:-misty}
      MISTY_APP_DB_USER: ${DB_USER:-misty_app}
      MISTY_APP_DB_PASSWORD: ${DB_PASSWORD:-misty}
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: >-
        host=postgres port=5432
        user=${DB_MIGRATION_USER:-misty}
        password=${DB_MIGRATION_PASSWORD:-misty}
        dbname=${DB_NAME:-misty_server}
        sslmode=disable
      GOOSE_MIGRATION_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    networks: [database, edge]

  misty-api:
    <<: *api-image
    container_name: misty-api
    logging: {driver: local, options: {max-size: "10m", max-file: "3"}}
    restart: unless-stopped
    env_file:
      - path: ${MISTY_ENV_DIR:-~/.misty/dev/default/.env/server}/runtime.env
        required: false
      - path: ${MISTY_ENV_DIR:-~/.misty/dev/default/.env/server}/database.env
        required: false
      - path: ${MISTY_ENV_DIR:-~/.misty/dev/default/.env/server}/storage.env
        required: false
      - path: ${MISTY_ENV_DIR:-~/.misty/dev/default/.env/server}/observability.env
        required: false
      - path: ${MISTY_ENV_DIR:-~/.misty/dev/default/.env/server}/mailjet.env
        required: false
      - path: ${MISTY_ENV_DIR:-~/.misty/dev/default/.env/server}/google.env
        required: false
      - path: ${MISTY_ENV_DIR:-~/.misty/dev/default/.env/server}/crypto/documents.env
        required: false
      - path: ${MISTY_ENV_DIR:-~/.misty/dev/default/.env/server}/crypto/spaces.env
        required: false
      - path: ${MISTY_ENV_DIR:-~/.misty/dev/default/.env/server}/crypto/services.env
        required: false
      # LIVEKIT_API_SECRET, which `misty server up` makes once.
      - path: ${MISTY_ENV_DIR:-~/.misty/dev/default/.env/server}/crypto/livekit.env
        required: false
    environment:
      PORT: "8080"
      MISTY_ENVIRONMENT: development
      # Calls go through LiveKit below, its signalling forwarded by the API from /v1/calls/rtc.
      LIVEKIT_URL: "${MISTY_DEV_API_ORIGIN:?run misty setup cloudflare}/v1/calls"
      LIVEKIT_API_KEY: misty
      # The API reaches LiveKit on the Docker network: its admin API, to end calls left with one
      # person, and its signalling, which it forwards from /v1/calls/rtc.
      LIVEKIT_ADMIN_URL: http://livekit:7880
      # The API stays publicly reachable for callbacks, while the development
      # website runs only on localhost through Vite.
      MISTY_PUBLIC_API_URL: "${MISTY_DEV_API_ORIGIN:?run misty setup cloudflare}/v1"
      MISTY_ALLOWED_ORIGINS: "${MISTY_DEV_ALLOWED_ORIGINS:-tauri://localhost,http://tauri.localhost,https://tauri.localhost,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-misty_app}
      DB_PASSWORD: ${DB_PASSWORD:-misty}
      DB_NAME: ${DB_NAME:-misty_server}
      DB_MIGRATION_USER: ""
      DB_MIGRATION_PASSWORD: ""
      CLOUDFLARE_API_TOKEN: ""
    depends_on:
      setup:
        condition: service_completed_successfully
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health >/dev/null"]
      # Quick checks only while starting, so dependents come up fast; then every 15 minutes.
      start_period: 90s
      start_interval: 3s
      interval: 15m
      timeout: 5s
      retries: 3
    ports:
      - "127.0.0.1:${MISTY_HOST_PORT:-8081}:8080"
    networks: [edge, database]

  # LiveKit carries calls (DMs and Space voice channels), as on a deployed server (compose.yml),
  # always on here. Calls are end-to-end encrypted between the people's computers, so neither the
  # server nor LiveKit can hear or see them. Signalling reaches it through the API; sound and
  # video are UDP, which a tunnel can't carry, so they go straight to this Mac at the local network
  # address `misty server up` finds (MISTY_DEV_LAN_IP). Someone on another network needs UDP
  # 3478 and 7882 and TCP 7881 forwarded to this Mac.
  livekit:
    image: livekit/livekit-server:v1.8.4
    logging: {driver: local, options: {max-size: "10m", max-file: "3"}}
    restart: unless-stopped
    env_file:
      - path: ${MISTY_ENV_DIR:-~/.misty/dev/default/.env/server}/crypto/livekit.env
        required: false
    entrypoint:
      - /bin/sh
      - -ec
      - 'export LIVEKIT_KEYS="misty: $${LIVEKIT_API_SECRET:?run misty server up}"; unset LIVEKIT_API_SECRET; exec /livekit-server'
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        # At most 8 people in any call, whatever asked for the room. An empty room closes after 30
        # seconds, and 20 after its last person leaves; the API ends a room left with one person
        # after five minutes.
        room:
          max_participants: 8
          empty_timeout: 30
          departure_timeout: 20
        # Tells the API who joins and leaves each room, so it ends a call the moment it has had one
        # person in it for five minutes.
        webhook:
          api_key: misty
          urls:
            - http://misty-api:8080/v1/calls/livekit-events
        rtc:
          tcp_port: 7881
          udp_port: 7882
          # The address other computers reach this Mac at; inside Docker LiveKit can't see it.
          node_ip: "${MISTY_DEV_LAN_IP:-127.0.0.1}"
          use_external_ip: false
        turn:
          enabled: true
          udp_port: 3478
    ports:
      - "7881:7881"
      - "3478:3478/udp"
      - "7882:7882/udp"
    networks: [edge]

  tunnel:
    image: misty-cloudflared-dev:local
    build:
      context: .
      dockerfile_inline: |
        FROM cloudflare/cloudflared:2026.7.3@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf AS cloudflared

        FROM alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1

        RUN apk add --no-cache ca-certificates

        COPY --from=cloudflared /usr/local/bin/cloudflared /usr/local/bin/cloudflared

        ENTRYPOINT ["/usr/local/bin/cloudflared"]

    logging: {driver: local, options: {max-size: "10m", max-file: "3"}}
    restart: unless-stopped

    env_file:
      - path: ${MISTY_ENV_DIR:-~/.misty/dev/default/.env/server}/cloudflare.env
        required: false

    environment:
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?run misty setup cloudflare}

    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export TUNNEL_TOKEN="$${CLOUDFLARE_TUNNEL_TOKEN}"
        unset CLOUDFLARE_TUNNEL_TOKEN
        exec /usr/local/bin/cloudflared tunnel --no-autoupdate --protocol http2 --metrics 0.0.0.0:20241 run

    depends_on:
      misty-api:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:20241/metrics | grep -Eq '^cloudflared_tunnel_ha_connections [1-9][0-9]*(\\.[0-9]+)?$'"
        ]
      interval: 15s
      timeout: 7s
      retries: 3
      start_period: 10s

    networks:
      - edge

volumes:
  pgdata:

networks:
  edge:
  database:
    internal: true
