name: misty-server-production

# Self-hosting and production. Without MISTY_API_IMAGE and MISTY_AGENT_RUNTIME_IMAGE
# the images build from this checkout; set them to published digests to pull instead.
x-api-image: &api-image
  image: ${MISTY_API_IMAGE:-misty-api:local}
  build:
    context: .
    dockerfile: Dockerfile

x-agent-runtime-image: &agent-runtime-image
  image: ${MISTY_AGENT_RUNTIME_IMAGE:-misty-agent-runtime:local}
  build:
    context: .
    dockerfile: apps/agent-runtime/Dockerfile
    target: runtime

x-logging: &logging
  logging: {driver: local, options: {max-size: "10m", max-file: "3"}}

services:
  # One PostgreSQL server holds two databases: Misty's (with pgvector) and the
  # agent runtime's workflow database, each owned by its own role.
  postgres:
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    # The API pool (up to 50) and the agent runtime's workflow pool (60) together
    # exceed the default 100 connections.
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-200}"]
    <<: *logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_MIGRATION_USER:?set DB_MIGRATION_USER}
      POSTGRES_PASSWORD: ${DB_MIGRATION_PASSWORD:?set DB_MIGRATION_PASSWORD}
      POSTGRES_DB: ${DB_NAME:?set DB_NAME}
      MISTY_APP_DB_USER: ${DB_USER:?set DB_USER}
      MISTY_APP_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/docker/postgres-init-app-role.sh:/docker-entrypoint-initdb.d/10-misty-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks: [database]

  migrate:
    <<: *api-image
    restart: "no"
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: >-
        host=postgres port=5432
        user=${DB_MIGRATION_USER:?set DB_MIGRATION_USER}
        password=${DB_MIGRATION_PASSWORD:?set DB_MIGRATION_PASSWORD}
        dbname=${DB_NAME:?set DB_NAME}
        sslmode=disable
      GOOSE_MIGRATION_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/goose"]
    command: ["up"]
    networks: [database]

  # Grants the Misty application role and creates the agent runtime's
  # separate workflow database on the same PostgreSQL server.
  database-permissions:
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${DB_NAME:?set DB_NAME}
      PGUSER: ${DB_MIGRATION_USER:?set DB_MIGRATION_USER}
      PGPASSWORD: ${DB_MIGRATION_PASSWORD:?set DB_MIGRATION_PASSWORD}
      MISTY_APP_DB_USER: ${DB_USER:?set DB_USER}
      MISTY_APP_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      AGENT_RUNTIME_DB_PASSWORD: ${AGENT_RUNTIME_DB_PASSWORD:?set AGENT_RUNTIME_DB_PASSWORD}
    volumes:
      - ./scripts/docker/postgres-grant-app-role.sh:/usr/local/bin/misty-grant-app-role:ro
      - ./scripts/docker/postgres-workflow-database.sh:/usr/local/bin/misty-workflow-database:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-c", "/bin/sh /usr/local/bin/misty-grant-app-role && /bin/sh /usr/local/bin/misty-workflow-database"]
    networks: [database]

  agent-runtime-setup:
    <<: [*agent-runtime-image, *logging]
    restart: "no"
    environment:
      WORKFLOW_TARGET_WORLD: "@workflow/world-postgres"
      WORKFLOW_POSTGRES_URL: postgres://workflow:${AGENT_RUNTIME_DB_PASSWORD:?set AGENT_RUNTIME_DB_PASSWORD}@postgres:5432/workflow
    depends_on:
      database-permissions:
        condition: service_completed_successfully
    command: ["node", "node_modules/@workflow/world-postgres/bin/setup.js"]
    networks: [database]

  agent-runtime:
    <<: [*agent-runtime-image, *logging]
    restart: unless-stopped
    environment:
      PORT: "3000"
      WORKFLOW_TARGET_WORLD: "@workflow/world-postgres"
      WORKFLOW_POSTGRES_URL: postgres://workflow:${AGENT_RUNTIME_DB_PASSWORD:?set AGENT_RUNTIME_DB_PASSWORD}@postgres:5432/workflow
      MISTY_INTERNAL_API_BASE: http://api:8080
      MISTY_AGENT_RUNTIME_CONTROL_SECRET: ${MISTY_AGENT_RUNTIME_CONTROL_SECRET:?set MISTY_AGENT_RUNTIME_CONTROL_SECRET}
      MISTY_AGENT_RUNTIME_CONTROL_SECRET_PREVIOUS: ${MISTY_AGENT_RUNTIME_CONTROL_SECRET_PREVIOUS:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      VERCEL_OIDC_TOKEN: ${VERCEL_OIDC_TOKEN:-}
      AI_GATEWAY_BASE_URL: ${AI_GATEWAY_BASE_URL:-}
      MISTY_AGENT_MODEL: ${MISTY_AGENT_MODEL:-}
      # Server-side model keys, used only for accounts whose devices send none (docs/byok.md).
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      # Speaks the voice pipeline (ElevenLabs Flash).
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      # Transcribes recordings (Soniox); live transcription also needs the switch on.
      SONIOX_API_KEY: ${SONIOX_API_KEY:-}
      MISTY_RUNTIME_LIVE_TRANSCRIBE: ${MISTY_RUNTIME_LIVE_TRANSCRIBE:-}
      # Agent steps run at once (the engine's default is 10, which queues the
      # eleventh user); the pool holds one connection per step plus headroom.
      WORKFLOW_POSTGRES_WORKER_CONCURRENCY: ${WORKFLOW_POSTGRES_WORKER_CONCURRENCY:-50}
      WORKFLOW_POSTGRES_MAX_POOL_SIZE: ${WORKFLOW_POSTGRES_MAX_POOL_SIZE:-60}
    depends_on:
      agent-runtime-setup:
        condition: service_completed_successfully
    # Lets a local Ollama or other model server on this host be reached as
    # host.docker.internal on Linux too (Docker Desktop provides it already).
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [edge, database]

  api:
    <<: [*api-image, *logging]
    restart: unless-stopped
    env_file:
      - path: .env/${MISTY_ENV_TARGET:-prod}/runtime.env
        required: false
      - path: .env/${MISTY_ENV_TARGET:-prod}/database.env
        required: false
      - path: .env/${MISTY_ENV_TARGET:-prod}/storage.env
        required: false
      - path: .env/${MISTY_ENV_TARGET:-prod}/observability.env
        required: false
      - path: .env/${MISTY_ENV_TARGET:-prod}/integrations/ai.env
        required: false
      - path: .env/${MISTY_ENV_TARGET:-prod}/composio.env
        required: false
      - path: .env/${MISTY_ENV_TARGET:-prod}/integrations/composio.env
        required: false
      - path: .env/${MISTY_ENV_TARGET:-prod}/integrations/dropbox.env
        required: false
      - path: .env/${MISTY_ENV_TARGET:-prod}/integrations/email.env
        required: false
      - path: .env/${MISTY_ENV_TARGET:-prod}/integrations/google.env
        required: false
      - path: .env/${MISTY_ENV_TARGET:-prod}/integrations/microsoft.env
        required: false
      - path: .env/${MISTY_ENV_TARGET:-prod}/crypto/documents.env
        required: false
      - path: .env/${MISTY_ENV_TARGET:-prod}/crypto/journal.env
        required: false
      - path: .env/${MISTY_ENV_TARGET:-prod}/crypto/devices.env
        required: false
      - path: .env/${MISTY_ENV_TARGET:-prod}/crypto/spaces.env
        required: false
      - path: .env/${MISTY_ENV_TARGET:-prod}/crypto/services.env
        required: false
    environment:
      PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?set DB_NAME}
      DB_USER: ${DB_USER:?set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      DB_MIGRATION_USER: ""
      DB_MIGRATION_PASSWORD: ""
      CLOUDFLARE_API_TOKEN: ""
      # Library files stay on this volume unless an S3/R2 endpoint is configured.
      MISTY_LIBRARY_FILESYSTEM_DIR: ${MISTY_LIBRARY_FILESYSTEM_DIR:-/var/lib/misty/library}
      MISTY_AGENT_RUNTIME_URL: http://agent-runtime:3000
      MISTY_AGENT_RUNTIME_INTERNAL_API_URL: http://api:8080
      MISTY_AGENT_RUNTIME_CONTROL_SECRET: ${MISTY_AGENT_RUNTIME_CONTROL_SECRET:?set MISTY_AGENT_RUNTIME_CONTROL_SECRET}
      MISTY_AGENT_RUNTIME_CONTROL_SECRET_PREVIOUS: ${MISTY_AGENT_RUNTIME_CONTROL_SECRET_PREVIOUS:-}
    ports:
      - "127.0.0.1:${MISTY_HOST_PORT:-8081}:8080"
    volumes:
      - librarydata:/var/lib/misty/library
    depends_on:
      database-permissions:
        condition: service_completed_successfully
        restart: true
      agent-runtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 30
    networks: [edge, database]

  # Optional: the collaboration Worker on this server instead of Cloudflare, in workerd
  # (wrangler's local mode) with its Durable Objects persisted to a volume. Start it with
  # `--profile collab`, publish 127.0.0.1:8787 over HTTPS on its own hostname and set
  # PARTYKIT_HOST to that hostname (docs/cloudflare.md#run-it-on-your-own-server).
  collab:
    profiles: [collab]
    image: ${MISTY_COLLAB_IMAGE:-misty-journal-collab:local}
    build:
      context: apps/journal-collab
      dockerfile_inline: |
        FROM node:24-bookworm-slim@sha256:c86ecead9e55a5210ac1727de38a4ca840bf03dcaf34dc9749addbf383b1920c
        WORKDIR /app
        COPY package.json package-lock.json ./
        RUN npm ci --no-audit --no-fund
        COPY tsconfig.json wrangler.jsonc ./
        COPY src ./src
        ENV WRANGLER_SEND_METRICS=false CI=true
        EXPOSE 8787
        CMD ["npx", "wrangler", "dev", "--ip", "0.0.0.0", "--port", "8787", "--persist-to", "/data", "--var", "MISTY_INTERNAL_API_BASE:http://api:8080/v1"]
    <<: *logging
    restart: unless-stopped
    volumes:
      - collabdata:/data
      - ./apps/journal-collab/.secrets/worker.prod.env:/app/.dev.vars:ro
    ports:
      - "127.0.0.1:${MISTY_COLLAB_HOST_PORT:-8787}:8787"
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]

volumes:
  pgdata:
  librarydata:
  collabdata:

networks:
  edge:
  database:
    internal: true
