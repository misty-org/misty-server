# Publishes the two images compose.yml runs, so another stack can run the
# server without building it (MISTY_API_IMAGE, MISTY_TOOLS_IMAGE):
#
#   ghcr.io/misty-org/misty-server-api
#   ghcr.io/misty-org/misty-server-tools
#
# Every push to main is tagged with its full commit SHA, and every v* git tag
# with that tag's name (v1.2.3). Tags are never moved: a tag that already
# exists is left as it is, so re-running a job never replaces an image. There
# is no latest tag.
name: images

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile
          - name: tools
            dockerfile: deploy/setup/Dockerfile
    env:
      IMAGE: ghcr.io/misty-org/misty-server-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Choose the tag
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$GITHUB_SHA"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            echo "::error::$tag is not a valid image tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Skip a tag that already exists
        id: existing
        run: |
          if docker buildx imagetools inspect "$IMAGE:${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "$IMAGE:${{ steps.tag.outputs.tag }} already exists; leaving it unchanged"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        if: steps.existing.outputs.exists != 'true'
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
