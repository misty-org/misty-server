<!doctype html><html><head><meta charset="utf-8"><title>Budget – Sheet1</title>
<style>body{font:14px system-ui;margin:24px}#grid{display:grid;grid-template-columns:40px repeat(4,140px);border-left:1px solid #ccc;border-top:1px solid #ccc}.c{border-right:1px solid #ccc;border-bottom:1px solid #ccc;height:26px;padding:2px 6px;box-sizing:border-box;overflow:hidden;white-space:nowrap}.h{background:#eee;font-weight:600}.sel{outline:2px solid #333}#edit{position:absolute;display:none;font:14px system-ui}</style></head>
<body><h1>Budget</h1><label for="namebox">Name box</label> <input id="namebox" size="6" value="A1"> <span id="formula" aria-label="Cell value"></span>
<div id="grid" role="grid" aria-label="Sheet1" tabindex="0"></div><input id="edit" aria-label="Cell editor">
<button id="save">Save</button> <span id="status" role="status"></span>
<script>
const COLS=['A','B','C','D'],ROWS=12;const cells={};let sel='A1';window.__evalState={cells,saved:null};
// ?preset=prospects: a list of companies for the workflow eval's prospect research.
if(new URLSearchParams(location.search).get('preset')==='prospects'){Object.assign(cells,{A1:'Company',B1:'Industry',C1:'Employee range',D1:'HQ city',A2:'Ramp',A3:'Linear',A4:'Pigment',A5:'Airtable'})}
const grid=document.getElementById('grid');
function key(c,r){return c+r}
function render(){let h='<div class="c h"></div>'+COLS.map(c=>'<div class="c h" role="columnheader">'+c+'</div>').join('');
for(let r=1;r<=ROWS;r++){h+='<div class="c h" role="rowheader">'+r+'</div>';for(const c of COLS){const k=key(c,r);h+='<div class="c'+(k===sel?' sel':'')+'" role="gridcell" data-k="'+k+'" aria-label="'+k+'">'+(cells[k]??'')+'</div>'}}
grid.innerHTML=h;document.getElementById('namebox').value=sel;document.getElementById('formula').textContent=cells[sel]??''}
function select(k){if(!/^[A-D]([1-9]|1[0-2])$/.test(k))return;sel=k;for(const el of grid.querySelectorAll('.sel'))el.classList.remove('sel');grid.querySelector('[data-k="'+k+'"]')?.classList.add('sel');document.getElementById('namebox').value=sel;document.getElementById('formula').textContent=cells[sel]??''}
function commit(k,v){cells[k]=v;const el=grid.querySelector('[data-k="'+k+'"]');if(el)el.textContent=v}
grid.addEventListener('click',e=>{const k=e.target.dataset?.k;if(k)select(k)});
grid.addEventListener('dblclick',e=>{const k=e.target.dataset?.k;if(!k)return;select(k);const ed=document.getElementById('edit');const r=grid.querySelector('[data-k="'+k+'"]').getBoundingClientRect();ed.style.display='block';ed.style.left=r.left+scrollX+'px';ed.style.top=r.top+scrollY+'px';ed.value=cells[k]??'';ed.focus()});
document.getElementById('edit').addEventListener('keydown',e=>{if(e.key==='Enter'){commit(sel,e.target.value);e.target.style.display='none';const m=/([A-D])(\d+)/.exec(sel);select(m[1]+Math.min(ROWS,+m[2]+1));grid.focus()}});
document.getElementById('namebox').addEventListener('keydown',e=>{if(e.key==='Enter'){select(e.target.value.trim().toUpperCase());grid.focus()}});
grid.addEventListener('paste',e=>{const text=e.clipboardData?.getData('text/plain');if(!text)return;e.preventDefault();const m=/([A-D])(\d+)/.exec(sel);const c0=COLS.indexOf(m[1]),r0=+m[2];
text.replace(/\r/g,'').split('\n').filter((l,i,a)=>l||i<a.length-1).forEach((line,i)=>line.split('\t').forEach((v,j)=>{const c=COLS[c0+j],r=r0+i;if(c&&r<=ROWS)commit(key(c,r),v)}))});
grid.addEventListener('keydown',e=>{if(e.target!==grid)return;if(e.key.length===1&&!e.metaKey&&!e.ctrlKey){grid.dispatchEvent(new MouseEvent('dblclick',{bubbles:true}));}});
document.getElementById('save').onclick=()=>{window.__evalState.saved=JSON.parse(JSON.stringify(cells));document.getElementById('status').textContent='Saved'};
render();
</script></body></html>
