<!doctype html><html><head><meta charset="utf-8"><title>Inbox – Fieldmail</title>
<style>body{font:15px system-ui;margin:24px;max-width:640px}label{display:block;margin-top:10px}#body{border:1px solid #999;min-height:120px;padding:8px}</style></head>
<body><h1>New message</h1>
<label for="to">To</label><input id="to" size="40">
<label for="subject">Subject</label><input id="subject" size="40">
<label id="bodylabel">Message</label><div id="body" contenteditable="true" role="textbox" aria-labelledby="bodylabel" aria-multiline="true"></div>
<p><button id="draft">Save draft</button> <button id="send">Send</button></p><p id="status" role="status"></p>
<script>
window.__evalState={draft:null,sent:null};const $=id=>document.getElementById(id);
const msg=()=>({to:$('to').value,subject:$('subject').value,body:$('body').innerText.trim()});
$('draft').onclick=()=>{window.__evalState.draft=msg();$('status').textContent='Draft saved'};
$('send').onclick=()=>{if(!$('to').value){$('status').textContent='Add a recipient';return}window.__evalState.sent=msg();$('status').textContent='Message sent'};
</script></body></html>
