<!doctype html><html><head><meta charset="utf-8"><title>Book a meeting</title>
<style>body{font:15px system-ui;margin:24px}[role=listbox]{border:1px solid #333;max-width:260px;padding:2px}[role=option]{padding:4px;cursor:pointer}[role=option][aria-selected=true]{background:#ddd}.cal{display:grid;grid-template-columns:repeat(7,36px);gap:2px}.cal button{width:36px;height:30px}</style></head>
<body><h1>Book a meeting</h1>
<label for="who">With</label><br><input id="who" role="combobox" aria-expanded="false" aria-controls="people" aria-autocomplete="list" autocomplete="off"><div id="people" role="listbox" aria-label="People" hidden></div>
<h2 id="month">November 2026</h2><div class="cal" role="group" aria-labelledby="month" id="cal"></div>
<label for="time">Time</label> <select id="time"><option>09:00</option><option>10:30</option><option>14:00</option><option>16:30</option></select>
<p><button id="book">Book meeting</button></p><p id="status" role="status"></p>
<script>
const people=['Ada Lovelace','Alan Turing','Grace Hopper','Katherine Johnson','Linus Torvalds'];let person='',day=0;window.__evalState={booked:null};
const who=document.getElementById('who'),list=document.getElementById('people');
who.addEventListener('input',()=>{const q=who.value.toLowerCase();const m=people.filter(p=>p.toLowerCase().includes(q));list.innerHTML=m.map(p=>'<div role="option" tabindex="-1">'+p+'</div>').join('');list.hidden=!q||!m.length;who.setAttribute('aria-expanded',String(!list.hidden));person=''});
list.addEventListener('click',e=>{if(e.target.getAttribute('role')==='option'){person=e.target.textContent;who.value=person;list.hidden=true;who.setAttribute('aria-expanded','false')}});
document.getElementById('cal').innerHTML=Array.from({length:30},(_,i)=>'<button aria-label="November '+(i+1)+'" aria-pressed="false" data-d="'+(i+1)+'">'+(i+1)+'</button>').join('');
document.getElementById('cal').addEventListener('click',e=>{const d=e.target.dataset?.d;if(d){day=+d;for(const b of document.querySelectorAll('#cal button'))b.setAttribute('aria-pressed',String(b.dataset.d==d))}});
document.getElementById('book').onclick=()=>{const s=document.getElementById('status');if(!person||!day){s.textContent='Pick a person from the list and a day.';return}
window.__evalState.booked={person,day,time:document.getElementById('time').value};s.textContent='Booked with '+person+' on November '+day};
</script></body></html>
