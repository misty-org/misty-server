<!doctype html><html><head><meta charset="utf-8"><title>Join Northwind</title>
<style>body{font:16px system-ui;margin:40px}label{display:block;margin:12px 0 4px}.terms input{position:absolute;opacity:0;width:1px;height:1px}.terms span::before{content:"☐ "}.terms input:checked+span::before{content:"☑ "}section{max-width:420px}</style></head>
<body><h1>Create your Northwind account</h1><p id="progress">Step 1 of 3</p>
<section id="s1"><label for="name">Full name</label><input id="name" autocomplete="name">
<label for="email">Work email</label><input id="email" type="email">
<p id="err1" role="alert"></p><button id="next1">Next</button></section>
<section id="s2" hidden><label for="plan">Plan</label><select id="plan"><option value="">Choose…</option><option value="basic">Basic</option><option value="pro">Pro</option><option value="max">Max</option></select>
<label for="country">Country</label><input id="country" list="countries"><datalist id="countries"><option>Canada</option><option>Japan</option><option>United States</option></datalist>
<label class="terms"><input type="checkbox" id="terms"><span>I agree to the terms</span></label>
<p id="err2" role="alert"></p><button id="back2">Back</button> <button id="next2">Next</button></section>
<section id="s3" hidden><h2>Review</h2><dl id="review"></dl><button id="create">Create account</button></section>
<p id="done" role="status"></p>
<script>
window.__evalState={submitted:null};
const $=id=>document.getElementById(id);
const show=n=>{for(const i of [1,2,3])$('s'+i).hidden=i!==n;$('progress').textContent='Step '+n+' of 3'};
$('next1').onclick=()=>{if(!$('name').value.trim()||!/@/.test($('email').value)){$('err1').textContent='Enter your name and a valid email.';return}$('err1').textContent='';show(2)};
$('back2').onclick=()=>show(1);
let flaky=new URLSearchParams(location.search).has('flaky');
$('next2').onclick=()=>{if(!$('plan').value||!$('terms').checked||!$('country').value){$('err2').textContent='Choose a plan and country, and accept the terms.';return}
 if(flaky){flaky=false;$('err2').textContent='Something went wrong on our side. Please try again.';return}
 $('review').innerHTML='<dt>Name</dt><dd>'+$('name').value+'</dd><dt>Email</dt><dd>'+$('email').value+'</dd><dt>Plan</dt><dd>'+$('plan').selectedOptions[0].text+'</dd><dt>Country</dt><dd>'+$('country').value+'</dd>';show(3)};
$('create').onclick=()=>{window.__evalState.submitted={name:$('name').value,email:$('email').value,plan:$('plan').value,country:$('country').value,terms:$('terms').checked};$('s3').hidden=true;$('done').textContent='Welcome, '+$('name').value+'! Your account is ready.'};
</script></body></html>
