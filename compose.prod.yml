name: misty-server-production

x-api-image: &api-image
  image: ${MISTY_API_IMAGE:?set immutable MISTY_API_IMAGE}

x-agent-runtime-image: &agent-runtime-image
  image: ${MISTY_AGENT_RUNTIME_IMAGE:?set immutable MISTY_AGENT_RUNTIME_IMAGE}

x-logging: &logging
  logging: {driver: local, options: {max-size: "10m", max-file: "3"}}

services:
  # One PostgreSQL server holds two databases: Misty's (with pgvector) and the
  # agent runtime's workflow database, each owned by its own role.
  postgres:
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    <<: *logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_MIGRATION_USER:?set DB_MIGRATION_USER}
      POSTGRES_PASSWORD: ${DB_MIGRATION_PASSWORD:?set DB_MIGRATION_PASSWORD}
      POSTGRES_DB: ${DB_NAME:?set DB_NAME}
      MISTY_APP_DB_USER: ${DB_USER:?set DB_USER}
      MISTY_APP_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/docker/postgres-init-app-role.sh:/docker-entrypoint-initdb.d/10-misty-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks: [database]

  migrate:
    <<: *api-image
    restart: "no"
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: >-
        host=postgres port=5432
        user=${DB_MIGRATION_USER:?set DB_MIGRATION_USER}
        password=${DB_MIGRATION_PASSWORD:?set DB_MIGRATION_PASSWORD}
        dbname=${DB_NAME:?set DB_NAME}
        sslmode=disable
      GOOSE_MIGRATION_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/goose"]
    command: ["up"]
    networks: [database]

  # Grants the Misty application role and creates the agent runtime's
  # separate workflow database on the same PostgreSQL server.
  database-permissions:
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${DB_NAME:?set DB_NAME}
      PGUSER: ${DB_MIGRATION_USER:?set DB_MIGRATION_USER}
      PGPASSWORD: ${DB_MIGRATION_PASSWORD:?set DB_MIGRATION_PASSWORD}
      MISTY_APP_DB_USER: ${DB_USER:?set DB_USER}
      MISTY_APP_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      AGENT_RUNTIME_DB_PASSWORD: ${AGENT_RUNTIME_DB_PASSWORD:?set AGENT_RUNTIME_DB_PASSWORD}
    volumes:
      - ./scripts/docker/postgres-grant-app-role.sh:/usr/local/bin/misty-grant-app-role:ro
      - ./scripts/docker/postgres-workflow-database.sh:/usr/local/bin/misty-workflow-database:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-c", "/bin/sh /usr/local/bin/misty-grant-app-role && /bin/sh /usr/local/bin/misty-workflow-database"]
    networks: [database]

  agent-runtime-setup:
    <<: [*agent-runtime-image, *logging]
    restart: "no"
    environment:
      WORKFLOW_TARGET_WORLD: "@workflow/world-postgres"
      WORKFLOW_POSTGRES_URL: postgres://workflow:${AGENT_RUNTIME_DB_PASSWORD:?set AGENT_RUNTIME_DB_PASSWORD}@postgres:5432/workflow
    depends_on:
      database-permissions:
        condition: service_completed_successfully
    command: ["node", "node_modules/@workflow/world-postgres/bin/setup.js"]
    networks: [database]

  agent-runtime:
    <<: [*agent-runtime-image, *logging]
    restart: unless-stopped
    environment:
      PORT: "3000"
      WORKFLOW_TARGET_WORLD: "@workflow/world-postgres"
      WORKFLOW_POSTGRES_URL: postgres://workflow:${AGENT_RUNTIME_DB_PASSWORD:?set AGENT_RUNTIME_DB_PASSWORD}@postgres:5432/workflow
      MISTY_INTERNAL_API_BASE: http://api:8080
      MISTY_AGENT_RUNTIME_CONTROL_SECRET: ${MISTY_AGENT_RUNTIME_CONTROL_SECRET:?set MISTY_AGENT_RUNTIME_CONTROL_SECRET}
      MISTY_AGENT_RUNTIME_CONTROL_SECRET_PREVIOUS: ${MISTY_AGENT_RUNTIME_CONTROL_SECRET_PREVIOUS:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VERCEL_OIDC_TOKEN: ${VERCEL_OIDC_TOKEN:-}
      AI_GATEWAY_BASE_URL: ${AI_GATEWAY_BASE_URL:-}
      MISTY_AGENT_MODEL: ${MISTY_AGENT_MODEL:-}
    depends_on:
      agent-runtime-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [edge, database]

  api:
    <<: [*api-image, *logging]
    restart: unless-stopped
    env_file:
      - path: .env/prod/runtime.env
        required: false
      - path: .env/prod/database.env
        required: false
      - path: .env/prod/storage.env
        required: false
      - path: .env/prod/observability.env
        required: false
      - path: .env/prod/integrations/ai.env
        required: false
      - path: .env/prod/composio.env
        required: false
      - path: .env/prod/integrations/composio.env
        required: false
      - path: .env/prod/integrations/dropbox.env
        required: false
      - path: .env/prod/integrations/email.env
        required: false
      - path: .env/prod/integrations/google.env
        required: false
      - path: .env/prod/integrations/microsoft.env
        required: false
      - path: .env/prod/integrations/billing.env
        required: false
      - path: .env/prod/crypto/documents.env
        required: false
      - path: .env/prod/crypto/journal.env
        required: false
      - path: .env/prod/crypto/devices.env
        required: false
      - path: .env/prod/crypto/spaces.env
        required: false
      - path: .env/prod/crypto/services.env
        required: false
    environment:
      PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?set DB_NAME}
      DB_USER: ${DB_USER:?set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      DB_MIGRATION_USER: ""
      DB_MIGRATION_PASSWORD: ""
      CLOUDFLARE_API_TOKEN: ""
      MISTY_AGENT_RUNTIME_URL: http://agent-runtime:3000
      MISTY_AGENT_RUNTIME_INTERNAL_API_URL: http://api:8080
      MISTY_AGENT_RUNTIME_CONTROL_SECRET: ${MISTY_AGENT_RUNTIME_CONTROL_SECRET:?set MISTY_AGENT_RUNTIME_CONTROL_SECRET}
      MISTY_AGENT_RUNTIME_CONTROL_SECRET_PREVIOUS: ${MISTY_AGENT_RUNTIME_CONTROL_SECRET_PREVIOUS:-}
    ports:
      - "127.0.0.1:${MISTY_HOST_PORT:-8081}:8080"
    depends_on:
      database-permissions:
        condition: service_completed_successfully
        restart: true
      agent-runtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 30
    networks: [edge, database]

volumes:
  pgdata:

networks:
  edge:
  database:
    internal: true
