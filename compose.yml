name: misty

# The Misty server stack. Everything you configure is in
# three files under ~/.misty/.env/server/ (MISTY_ENV_DIR names another folder):
# MISTY_HOSTNAME in misty.env, CLOUDFLARE_API_TOKEN in cloudflare.env and the
# Google client in google.env. The setup service generates one root secret
# into the secrets volume, derives every key from it, and provisions
# Cloudflare on each start.
# Data lives in the pgdata volume and in R2, and is removed only when the
# whole stack is (docker compose down --volumes).

x-config: &config
  # Every service reads the same three files. The API token for Cloudflare is
  # blanked for every service except setup, the only one that calls the API.
  env_file:
    - ${MISTY_ENV_DIR:-~/.misty/.env/server}/misty.env
    - ${MISTY_ENV_DIR:-~/.misty/.env/server}/cloudflare.env
    - ${MISTY_ENV_DIR:-~/.misty/.env/server}/google.env
  logging: {driver: local, options: {max-size: "10m", max-file: "3"}}

# setup, migrate, backups, alerts, console and cloudflared run one small image
# (deploy/setup/Dockerfile). MISTY_TOOLS_IMAGE and MISTY_API_IMAGE name
# published images to run instead, such as
# ghcr.io/misty-org/misty-server-tools:<commit SHA>; unset, Compose builds both
# from this checkout.
x-tools: &tools
  image: ${MISTY_TOOLS_IMAGE:-${COMPOSE_PROJECT_NAME}-tools:local}
  build:
    context: .
    dockerfile: deploy/setup/Dockerfile

# What the API and the console read besides the three files. The rest of their
# configuration (the API's share of the root secret, R2, the Worker host) is
# the secrets volume's server.env, loaded when each starts; they derive their
# keys from it.
x-server-environment: &server-environment
  CLOUDFLARE_API_TOKEN: ""
  MISTY_ENVIRONMENT: production
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: misty
  DB_USER: misty_app

services:
  # One-shot: generates the root secret on the first start, refuses to start
  # when the database holds data its secrets no longer match, and provisions
  # the tunnel, DNS, R2 buckets and credentials, and the collaboration Worker.
  # MISTY_TUNNEL_EXTRA_INGRESS (host=service, comma-separated) publishes more
  # hostnames through the same tunnel, for services that run beside the
  # server on the edge network. Set it where Compose runs, not in misty.env.
  setup:
    <<: [*tools, *config]
    command: ["init"]
    restart: "no"
    environment:
      MISTY_DATA_DIR: /var/lib/misty/pgdata
      MISTY_TUNNEL_EXTRA_INGRESS: ${MISTY_TUNNEL_EXTRA_INGRESS:-}
    volumes:
      - secrets:/run/misty/secrets
      - pgdata:/var/lib/misty/pgdata:ro
    networks: [edge]

  postgres:
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    <<: *config
    restart: unless-stopped
    environment:
      CLOUDFLARE_API_TOKEN: ""
      POSTGRES_USER: misty
      POSTGRES_DB: misty
      POSTGRES_PASSWORD_FILE: /run/misty/secrets/postgres/superuser-password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - secrets:/run/misty/secrets:ro
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U misty -d misty"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks: [database]

  # One-shot: keeps the API's restricted role in step with its password,
  # applies migrations and grants the role its tables.
  migrate:
    <<: [*tools, *config]
    command: ["migrate"]
    restart: "no"
    environment:
      CLOUDFLARE_API_TOKEN: ""
    volumes:
      - secrets:/run/misty/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [database]

  api:
    image: ${MISTY_API_IMAGE:-${COMPOSE_PROJECT_NAME}-api:local}
    build:
      context: .
      dockerfile: Dockerfile
      # The version /health reports for an image built here, such as
      # MISTY_SERVER_VERSION=$(git rev-parse HEAD) docker compose up -d --build.
      # Published images have their commit built in.
      args:
        MISTY_SERVER_VERSION: ${MISTY_SERVER_VERSION:-development}
    <<: *config
    # The three files, and Mailjet if this server sends email.
    env_file:
      - ${MISTY_ENV_DIR:-~/.misty/.env/server}/misty.env
      - ${MISTY_ENV_DIR:-~/.misty/.env/server}/cloudflare.env
      - ${MISTY_ENV_DIR:-~/.misty/.env/server}/google.env
      - path: ${MISTY_ENV_DIR:-~/.misty/.env/server}/mailjet.env
        required: false
      # Calls follow MISTY_CALLS=1: the API works out LIVEKIT_URL, LIVEKIT_API_KEY and
      # LIVEKIT_API_SECRET itself. A development stack can set them here instead.
      - path: ${MISTY_ENV_DIR:-~/.misty/.env/server}/livekit.env
        required: false
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ec", "set -a; . /run/misty/secrets/server.env; set +a; exec /usr/local/bin/misty-server"]
    environment:
      <<: *server-environment
      PORT: "8080"
      # The API reaches LiveKit's admin API on the Docker network, to end calls left with one
      # person. It is used only while calls are on (MISTY_CALLS=1 and the calls profile).
      LIVEKIT_ADMIN_URL: http://livekit:7880
    volumes:
      - secrets:/run/misty/secrets:ro
    ports:
      - "127.0.0.1:${MISTY_HOST_PORT:-8081}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health >/dev/null"]
      # Quick checks only while starting, so dependents come up fast; then every 15 minutes.
      start_period: 90s
      start_interval: 3s
      interval: 15m
      timeout: 5s
      retries: 3
    networks: [edge, database]

  # LiveKit carries calls (DMs and Space voice channels), only with MISTY_CALLS=1 in misty.env and
  # `docker compose --profile calls up`. The server only mints room tokens; calls are end-to-end
  # encrypted between the people's computers, so neither the server nor LiveKit can hear or see them.
  # Its signalling is published at MISTY_HOSTNAME's calls sibling through the tunnel (setup adds the
  # route); media goes straight to this machine, so open UDP 3478 and 50000-50100 and TCP 7881.
  livekit:
    image: livekit/livekit-server:v1.8.4
    profiles: [calls]
    # The same secret the API signs tokens with, derived from the root by setup (livekit/api-secret).
    entrypoint:
      - /bin/sh
      - -ec
      - 'export LIVEKIT_KEYS="misty: $$(cat /run/misty/secrets/livekit/api-secret)"; exec /livekit-server'
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        # At most 8 people in any call, whatever asked for the room. An empty room closes after 30
        # seconds, and 20 after its last person leaves; the API ends a room left with one person
        # after five minutes.
        room:
          max_participants: 8
          empty_timeout: 30
          departure_timeout: 20
        # Tells the API who joins and leaves each room, so it ends a call the moment it has had one
        # person in it for five minutes.
        webhook:
          api_key: misty
          urls:
            - http://api:8080/v1/calls/livekit-events
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          # Finds this machine's public address itself (STUN), so people on other networks reach it.
          use_external_ip: true
        # TURN over UDP for people behind strict networks; it needs no certificate.
        turn:
          enabled: true
          udp_port: 3478
    volumes:
      - secrets:/run/misty/secrets:ro
    ports:
      - "${LIVEKIT_HOST_PORT:-7880}:7880"
      - "7881:7881"
      - "3478:3478/udp"
      - "50000-50100:50000-50100/udp"
    restart: unless-stopped
    networks: [edge]

  # Publishes the API at https://MISTY_HOSTNAME through the tunnel setup made.
  cloudflared:
    <<: [*tools, *config]
    restart: unless-stopped
    environment:
      CLOUDFLARE_API_TOKEN: ""
    entrypoint:
      - /bin/sh
      - -ec
      - |
        TUNNEL_TOKEN="$$(cat /run/misty/secrets/cloudflared/token)"
        export TUNNEL_TOKEN
        exec cloudflared tunnel --no-autoupdate --metrics 0.0.0.0:20241 run
    volumes:
      - secrets:/run/misty/secrets:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:20241/ready >/dev/null"]
      interval: 15s
      timeout: 7s
      retries: 3
      start_period: 15s
    networks: [edge]

  # Nightly encrypted database backups to the locked R2 backup bucket.
  backups:
    <<: [*tools, *config]
    command: ["backup"]
    restart: unless-stopped
    environment:
      CLOUDFLARE_API_TOKEN: ""
    volumes:
      - secrets:/run/misty/secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [edge, database]

  # Records an open alert in the database when the API fails its health
  # check, fails 5% of its requests, runs low on disk or misses a nightly
  # backup, each seen twice in a row, and removes it when it clears. The
  # console and the server owner's app show open alerts; nothing is emailed.
  alerts:
    <<: [*tools, *config]
    command: ["watch"]
    restart: unless-stopped
    environment:
      CLOUDFLARE_API_TOKEN: ""
      MISTY_DATA_DIR: /var/lib/misty/pgdata
    volumes:
      - secrets:/run/misty/secrets:ro
      - pgdata:/var/lib/misty/pgdata:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [edge, database]

  # The operator console, on this computer only: http://127.0.0.1:7070.
  # `docker compose logs console` prints its sign-in link.
  console:
    <<: [*tools, *config]
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -ec
      - |
        set -a; . /run/misty/secrets/server.env; set +a
        exec misty-console -addr 0.0.0.0:7070 -published 127.0.0.1:${MISTY_CONSOLE_PORT:-7070} -api http://api:8080
    environment:
      <<: *server-environment
    volumes:
      - secrets:/run/misty/secrets:ro
    ports:
      - "127.0.0.1:${MISTY_CONSOLE_PORT:-7070}:7070"
    depends_on:
      api:
        condition: service_healthy
    networks: [edge, database]

volumes:
  pgdata:
  secrets:

networks:
  edge:
  database:
    internal: true
